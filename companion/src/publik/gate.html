<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Sign in with publik</title>
<style>
  :root { color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: #0b0d12; color: #f1f3f8; font: 16px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { box-sizing: border-box; height: 100%; padding: 34px 34px 18px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; overflow-x: hidden; }
  html, body { overflow-x: hidden; }
  .headline, .line, .callout { overflow-wrap: anywhere; }
  .headline { margin: 0; font-size: 31px; line-height: 1.15; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
  .line { margin: 0; font-size: 18px; color: #dfe3ec; }
  .small { margin: 0; font-size: 14px; color: #a7afc2; }
  /* The plan line: as big as the main line and set apart, never small print (Pranav, 2026-11-11). */
  .callout { margin: 2px 0 0; padding: 12px 14px; border-radius: 12px; background: #13261b; border: 1px solid #2c6a45; color: #e9fff1; font-size: 18px; font-weight: 650; line-height: 1.3; }
  /* The three steps, the one they are on lit. Small, in the window's own style. */
  .steps { margin: 2px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: #8790a5; }
  .steps li { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .steps li + li::before { content: ''; width: 14px; height: 1px; background: #3a4154; }
  .steps .n { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 9px; border: 1px solid #3a4154; font-size: 11px; font-weight: 700; }
  .steps li.on { color: #f1f3f8; font-weight: 600; }
  .steps li.on .n { background: #f1f3f8; color: #0b0d12; border-color: #f1f3f8; }
  .buttons { margin-top: auto; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .btn { display: flex; flex-direction: column; gap: 4px; }
  .btn small { color: #a7afc2; font-size: 13px; text-align: center; }
  button { font: inherit; font-weight: 600; font-size: 17px; padding: 14px 18px; border-radius: 12px; border: 1px solid #2a3040; background: #171b25; color: #f1f3f8; cursor: pointer; }
  button.primary { background: #f1f3f8; color: #0b0d12; border-color: #f1f3f8; font-size: 18px; }
  button.small { background: none; border: none; padding: 4px; color: #a7afc2; font-weight: 500; text-decoration: underline; font-size: 14px; }
  button:focus-visible { outline: 2px solid #7aa2ff; outline-offset: 2px; }
  .note { margin: 0; color: #a7afc2; font-size: 13px; text-align: center; }
  details { color: #8790a5; font-size: 12.5px; }
  details summary { cursor: pointer; }
  details p { margin: 6px 0 0; }
  .footnote { margin: 0; color: #6f778b; font-size: 11.5px; line-height: 1.4; }
</style>
</head>
<body>
<main>
  <p class="headline" id="headline"></p>
  <p class="line" id="line"></p>
  <p class="callout" id="callout" hidden></p>
  <ol class="steps" id="steps" hidden></ol>
  <p class="small" id="small" hidden></p>
  <p class="small" id="updating" hidden></p>
  <div class="buttons" id="buttons"></div>
  <p class="note" id="note" hidden></p>
  <details id="privacy" hidden><summary>What gets sent?</summary><p id="privacy-text"></p></details>
  <p class="footnote" id="footnote"></p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const put = (id, text) => { $(id).textContent = text || ''; $(id).hidden = !text; };
  let quietUntil = 0;
  document.addEventListener('keydown', (e) => { if (Date.now() < quietUntil) { e.preventDefault(); e.stopPropagation(); } }, true);
  // The window was touched: it no longer needs to stay on top.
  document.addEventListener('pointerdown', () => window.publikGate.touch(), true);
  document.addEventListener('keydown', () => window.publikGate.touch(), true);
  window.publikGate.onScreen((v) => {
    document.title = v.windowTitle || v.title;
    // Publik's title is the button's own label on the first screen, so the headline leads;
    // on the other screens it is shown as the headline when there is no line of ours.
    put('headline', v.headline || v.title); put('line', v.line); put('small', v.small); put('updating', v.updating);
    put('callout', v.callout);
    $('steps').replaceChildren(...(v.steps || []).map((t, i) => { const li = document.createElement('li'); li.className = i + 1 === v.step ? 'on' : ''; const n = document.createElement('span'); n.className = 'n'; n.textContent = String(i + 1); const s = document.createElement('span'); s.className = 't'; s.textContent = t; li.append(n, s); return li; }));
    $('steps').hidden = !(v.steps && v.steps.length);
    put('note', v.note); $('footnote').textContent = v.footnote || '';
    $('privacy-text').textContent = v.privacy || ''; $('privacy').hidden = !v.privacy;
    $('buttons').replaceChildren(...v.buttons.map((b) => {
      const wrap = document.createElement('div'); wrap.className = 'btn';
      const el = document.createElement('button'); el.textContent = b.label; el.className = b.primary ? 'primary' : b.small ? 'small' : '';
      el.onclick = () => window.publikGate.press(b.action);
      wrap.appendChild(el); if (b.caption) { const c = document.createElement('small'); c.textContent = b.caption; wrap.appendChild(c); }
      return wrap;
    }));
    // Came forward by itself while the person was elsewhere: nothing focused, keys ignored for a second.
    quietUntil = v.cameForward ? Date.now() + 1000 : 0;
    if (v.cameForward) { if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); }
    else { const btn = $('buttons').querySelector('button.primary') || $('buttons').querySelector('button'); if (btn) btn.focus(); }
  });
</script>
</body>
</html>
